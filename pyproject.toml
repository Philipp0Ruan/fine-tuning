[build-system]
requires = ["setuptools>=78,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intent"
version = "1.0.0"
description = "Fine-tuning e inferência para classificar suporte e venda em português"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.7.1",
  "transformers==4.57.1",
  "datasets==4.3.0",
  "accelerate==1.11.0",
  "numpy==2.2.4",
  "scikit-learn==1.6.1",
  "fastapi==0.121.0",
  "pydantic>=2.12,<3",
  "uvicorn==0.38.0",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab==4.4.10", "ipykernel==6.30.1", "nbformat==5.10.4"]

[project.scripts]
retail-intent = "retail_intent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
